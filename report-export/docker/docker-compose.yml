# report-export Docker Compose convenience wrapper (docs/design.md
# §4.7.5-§4.7.6). OPTIONAL: the canonical, documented invocation is a
# plain `docker run` (design.md §4.7.6); this file only pre-wires the
# three bind mounts from that same example so a weekly run reduces to
# one `docker compose run` line.
#
# The container runs as root (design.md §4.7.3/§4.7.4), so host
# bind-mount directories need no special ownership -- no uid/gid
# reconciliation, no `user:` directive below. NOTE: files the container
# writes to the host (state/, output/) will be owned by root; use
# `sudo` on the host if you need to remove or edit them directly.
#
#   export HOST_INPUT_DIR=/path/to/your/input-dir    # user-defined
#   export HOST_STATE_DIR=/path/to/your/state-dir    # user-defined
#   export HOST_OUTPUT_DIR=/path/to/your/output-dir  # user-defined
#   mkdir -p "$HOST_INPUT_DIR" "$HOST_STATE_DIR" "$HOST_OUTPUT_DIR"
#   cp /path/to/this-weeks-export.csv "$HOST_INPUT_DIR/"
#   docker compose -f docker/docker-compose.yml run --rm report-export \
#     /data/input/this-weeks-export.csv
#
# (build once beforehand with `docker build -t report-export:1.0.0 -f
# docker/Dockerfile .` from report-export/, or let `docker compose run`
# build it on first use.)
#
# 選配硬化 (optional hardening, not set here): security-conscious sites
# may additionally pass `--network none`/`network_mode: "none"`,
# `--read-only`/`read_only: true`, and a `/tmp` tmpfs on top of this
# base file -- none of the three affect the deliverable's output, only
# defense-in-depth (design.md §4.7.4). `TZ=Asia/Taipei` is deliberately
# NOT set here either: the image already bakes `ENV TZ=Asia/Taipei`
# (design.md §4.7.4), so an explicit override would be redundant.

services:
  report-export:
    image: report-export:1.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      # Weekly raw 14-column input CSV (design.md §4.7.5) -- read-only.
      # HOST_INPUT_DIR is user-defined; the ":?" form fails fast with a
      # clear message instead of silently falling back to a guessed path.
      - type: bind
        source: ${HOST_INPUT_DIR:?set HOST_INPUT_DIR to this week's input directory}
        target: /data/input
        read_only: true
      # Canonical state -- read-write; single source of truth
      # (design.md §3.5.1). Writable by any owner: the container runs
      # as root.
      - type: bind
        source: ${HOST_STATE_DIR:?set HOST_STATE_DIR to your canonical state directory}
        target: /data/state
      # Deliverable xlsx output -- read-write.
      - type: bind
        source: ${HOST_OUTPUT_DIR:?set HOST_OUTPUT_DIR to your deliverable output directory}
        target: /data/output
    # No `command:` here on purpose -- the input CSV filename changes
    # every week, so it is supplied on the `docker compose run ...`
    # command line, not baked into this file.
