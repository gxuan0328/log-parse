# tests/fixtures/test_hosts.conf — QA test-host fixture for the regression suite.
#
# tests/run_tests.sh exports LOG_PARSE_TEST_HOSTS_CONF pointing here, so every
# analyzer run in the suite filters against THIS set instead of the shipped
# conf/test_hosts.conf. Rationale: the shipped production conf uses
# 192.168.0.0/16 (external-user-only policy), which would exclude
# 192.168.139.119 — the bundled sample's dominant business client (712 of 723
# business IIS hits) — and collapse the sample's IIS/overview data to ~11
# requests, vacating the IIS feature baselines (--top N, status distribution,
# DICOM, endpoint CATEGORY, per-region breakdowns). This fixture instead pins
# the exact internal QA / health-probe IPs and deliberately does NOT list
# .119, keeping it as business traffic so the feature tests retain meaningful
# data. The shipped conf's /16 semantics are validated separately: J16 reads
# the shipped file (2 entries), J24-J27 exercise CIDR matching, and J29 asserts
# the shipped /16 excludes .119.
#
# Same format as the shipped conf (exact IPv4 or IPv4/CIDR both accepted).
