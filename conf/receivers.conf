# receivers.conf — mail recipients (收件者) for report delivery (--notify).
# Format: DISPLAY_NAME|ADDRESS
#   DISPLAY_NAME : may contain spaces and CJK; must not contain '|' , ; < > "
#                  or any control character; may be empty.
#   ADDRESS      : exactly one address, no angle brackets, no comma lists.
# Every row becomes one element of the API's "To" array, in file order.
# The sender ("From") is NOT configured here — see LOG_PARSE_NOTIFY_FROM_NAME /
# LOG_PARSE_NOTIFY_FROM_ADDR in docs/usage.md.
# '#' comments (inline or whole-line) and blank lines are ignored.
# Leading/trailing whitespace and CR (CRLF files) are stripped from EVERY field.
# At least one row is REQUIRED; a missing, empty or malformed file is a fatal
# error (fail-fast), consistent with regions.conf and test_hosts.conf.
# WARNING: attachments carry analysis output. By default (--notify-attach all)
# they include access_detail.* (client IPs, JWT-derived BIRTHDAY) and
# access_ip_counts.tsv (raw client-IP census). Every address below receives
# them. Review carefully before adding an EXTERNAL domain.

