# test_hosts.conf — internal (non-external) client sources.
# The current analysis scope is EXTERNAL user access records only, so every
# INTERNAL client source is treated as NON-business traffic and filtered here.
# Requests whose IIS c-ip (field 9) or access CLIENT_IP (CSV column 7) match an
# entry are handled per --test-hosts exclude|only|all (default: exclude).
#
# Format: one entry per line — an exact IPv4 (10.252.130.178) or an IPv4/prefix
# CIDR block (192.168.0.0/16). '#' comments (inline or whole-line) and blank
# lines are ignored. A client IP matches if it EQUALS an exact entry OR FALLS
# INSIDE any CIDR block (host bits of a non-canonical network are ignored;
# never regex/substring). Entries are validated at load — a malformed IPv4/CIDR
# aborts the run (fail-fast).
#
# NOTE: read on EVERY analyze_iis / analyze_access run (including --test-hosts
# all, where the set is not consulted). It must exist; a missing file is fatal,
# consistent with regions.conf.
#
# The whole private 192.168.0.0/16 range is internal, so ONE CIDR line covers
# every 192.168.x.x QA / probe / gateway source without enumerating each host —
# this deliberately INCLUDES 192.168.139.119, the internal production gateway
# (~712 IIS hits/week in the bundled sample). Under external-user-only analysis
# the gateway is internal infrastructure, not an external user, so its traffic
# is intentionally filtered out. List internal hosts OUTSIDE that range (e.g.
# the 10.x QA host below) as exact IPs or their own CIDR block.
192.168.0.0/16
10.252.130.178
