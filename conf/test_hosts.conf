# test_hosts.conf — internal QA / health-probe client IPs.
# Requests whose IIS c-ip (field 9) or access CLIENT_IP (CSV column 7) match
# these are treated as NON-business traffic. The active behaviour is chosen by
# --test-hosts exclude|only|all (default: exclude).
# Format: one entry per line — either an exact IPv4 (192.168.117.90) or an
# IPv4/prefix CIDR block (192.168.0.0/16) that covers a whole subnet without
# listing each host. '#' comments (inline or whole-line) and blank lines are
# ignored. A client IP matches if it EQUALS an exact entry OR FALLS INSIDE any
# CIDR block (host bits of a non-canonical network are ignored; never
# regex/substring). Entries are validated at load — a malformed IPv4/CIDR
# aborts the run (fail-fast).
# NOTE: this file is read on EVERY analyze_iis / analyze_access run, including
# --test-hosts all (where the set is not consulted). It must exist; a missing
# file is a fatal error (fail-fast), consistent with regions.conf.
# WARNING: do NOT add real user IPs. 192.168.139.119 is the production gateway
# (712 business hits/week) — it is one digit from .110 and must NOT appear here.
192.168.139.79
192.168.139.110
192.168.139.28

# Internal/QA test hosts — additional non-business client IPs to exclude.
192.168.117.90
192.168.105.149
192.168.117.73
192.168.117.104

# CIDR example (commented — enable only after re-reading the WARNING above):
# cover an ENTIRE subnet with one line instead of enumerating each host, e.g.
# the whole 192.168.117.0/24 QA range. A block must never swallow a real
# user/gateway IP — this is exactly why 192.168.139.0/24 is NOT used here: it
# would capture the .119 production gateway.
# 192.168.117.0/24
